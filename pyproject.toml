[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tts-gpt"
version = "0.1.0"
description = "A reproducible CLI toolkit for OpenAI TTS and OpenRouter image workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "tts-gpt contributors" }]
dependencies = [
  "openai==2.26.0",
  "python-dotenv==1.1.0",
  "soundfile==0.13.1",
  "scipy==1.17.1",
  "pyloudnorm==0.2.0",
  "requests==2.32.3",
  "Pillow==11.1.0",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
tts-gpt = "ttsgpt.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
